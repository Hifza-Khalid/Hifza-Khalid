name: "Hifza's Koi Fish 🐟"

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/fish.yml"

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate my koi fish
        uses: yalongwastaken/git-koi@v1
        with:
          login: Hifza-Khalid
          body: asagi
          output-dir: koi

      - name: Commit updated fish
        shell: bash
        run: |
          git add koi/koi.gif

          if git diff --cached --quiet; then
            echo "The koi is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit --quiet --message "koi: draw the day's fish"

          git pull --rebase --quiet origin "$GITHUB_REF_NAME"
          git push --quiet
